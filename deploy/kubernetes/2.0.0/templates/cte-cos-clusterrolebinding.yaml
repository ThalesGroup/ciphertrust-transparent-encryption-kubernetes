{{- if .Values.cos.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.cos.rbac.clusterRoleBindingName }}
  labels:
    app.kubernetes.io/name: cte-cos
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.cos.serviceAccountName }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.cos.rbac.clusterRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
