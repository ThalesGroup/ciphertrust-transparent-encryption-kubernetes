# CM Registration token Secret (registration_token_secret)
# The CoS proxy uses this token on startup to register itself as a client
# of the storage group.
#
# Replace <paste-registration-token-here> with the token from:
#   CipherTrust Manager → Clients → Registration Tokens → Generate
apiVersion: v1
kind: Secret
metadata:
  name: cos-reg-secret
  namespace: cos-demo
type: Opaque
data:
   # This is a base64 encoded registration token.  To generate:
   #   # echo <CM REGISTRATION TOKEN STRING> | base64 -w 0
  registration_token: "<paste-registration-token-here>"
