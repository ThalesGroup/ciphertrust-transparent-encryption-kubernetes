# Storage credential Secret (storage_cred)
# Store AWS credentials the proxy uses to talk to S3.
# Each entry key follows the pattern: AWS_ACCESS_KEY_ID_<label>
# The <label> suffix is chosen by the administrator to distinguish entries.
# A single Secret can hold multiple credential sets (see the multi-credential
# example at the bottom of this file).
#
# Field reference (JSON value per key):
#   api_version     : always 1
#   access_key_id   : AWS access key ID
#   secret_access_key: AWS secret access key

---
# Minimal example — single credential entry
apiVersion: v1
kind: Secret
metadata:
  name: cos-storage-cred
  namespace: cos-demo
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID_prod: |
    {
      "api_version": 1,
      "access_key_id": "AKIAEXAMPLE1234567",
      "secret_access_key": "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    }

---
# Extended example — multiple credential entries in one Secret
# Use this when one proxy needs to handle traffic for several sets of AWS credentials
# (e.g. a primary bucket and a backup bucket owned by different IAM users).
# Each entry must have a unique label suffix.
apiVersion: v1
kind: Secret
metadata:
  name: cos-storage-cred-multi
  namespace: cos-demo
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID_prod: |
    {
      "api_version": 1,
      "access_key_id": "AKIAPRODEXAMPLE12345",
      "secret_access_key": "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    }
  AWS_ACCESS_KEY_ID_backups: |
    {
      "api_version": 1,
      "access_key_id": "AKIABACKUPEXAMPLE678",
      "secret_access_key": "abcdefghijklmnopqrstuvwxyz0123456789EXAMPLE"
    }
