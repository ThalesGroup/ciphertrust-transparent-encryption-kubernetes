# External CA Secret (external_ca_secret)
# Package the Client CA certificate and private key into a Secret.
# The proxy uses the Client CA to dynamically generate per-connection certificates
# at runtime — one for each S3 hostname the application connects to.
# Both keys are required: ca.key (private key) and ca.crt (certificate).
#
# IMPORTANT: ca.crt and ca.key must be a matching public/private keypair.
# Verify before creating the Secret:
#   RSA:   openssl x509 -noout -modulus -in clientCA.crt | openssl md5
#          openssl rsa  -noout -modulus -in clientCA.key | openssl md5
#          (both commands must produce identical output)
#   ECDSA: openssl x509 -noout -pubkey -in clientCA.crt | openssl md5
#          openssl ec   -pubout -in clientCA.key         | openssl md5
#
# Option 1 — Create directly from certificate files (recommended):
#   kubectl create secret generic cos-external-ca \
#     --namespace cos-demo \
#     --from-file=ca.crt=./clientCA.crt \
#     --from-file=ca.key=./clientCA.key
#
# Option 2 — Apply this YAML file:
#   The 'data' field requires base64-encoded values. Generate them with:
#     base64 -w0 clientCA.crt   (paste output as value of ca.crt below)
#     base64 -w0 clientCA.key   (paste output as value of ca.key below)
#   On macOS use: base64 -i clientCA.crt  (no -w0 flag needed)
apiVersion: v1
kind: Secret
metadata:
  name: cos-external-ca
  namespace: cos-demo
type: Opaque
data:
  ca.crt: "<base64-encoded output of: base64 -w0 clientCA.crt>"
  ca.key: "<base64-encoded output of: base64 -w0 clientCA.key>"
