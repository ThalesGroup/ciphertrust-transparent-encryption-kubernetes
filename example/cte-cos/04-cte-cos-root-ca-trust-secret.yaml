# Root CA Trust Secret
# Package the Root CA certificate so application pods can trust it.
# Application pods mount this Secret and install the Root CA into their system
# trust store via a postStart lifecycle hook.
#
# NOTE: This Secret is NOT referenced by the CMregistrationClass.
# It is mounted directly into each application pod (see cte-cos-app-pod-*.yaml).
#
# The rootCA.key must NEVER enter the cluster. Only rootCA.crt is distributed here.
#
# Preferred creation method (from certificate file on disk):
#   kubectl create secret generic cos-root-ca-trust \
#     --namespace cos-demo \
#     --from-file=ca.crt=./rootCA.crt
#
# Equivalent YAML structure:
apiVersion: v1
kind: Secret
metadata:
  name: cos-root-ca-trust
  namespace: cos-demo
type: Opaque
data:
  ca.crt: "<rootCA.crt>"
